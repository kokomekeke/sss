[GNSS-SDR]
;######### GLOBAL OPTIONS ##################
GNSS-SDR.internal_fs_sps=4100000
GNSS-SDR.tow_to_trk=true

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=UHD_Signal_Source

; >>> FIX: helyes USRP serial <<<
SignalSource.device_address=serial=8002512,recv_frame_size=4096,num_recv_frames=512,send_frame_size=4096,num_send_frames=512

SignalSource.item_type=gr_complex
SignalSource.sampling_frequency=4100000

; GPS L2 frekvencia (ahogy nálad volt)
SignalSource.freq=1227600000

SignalSource.gain=45
SignalSource.subdevice=A:B
SignalSource.repeat=false
SignalSource.dump=false
SignalSource.dump_filename=../data/signal_source.dat
SignalSource.enable_throttle_control=false


;######### SIGNAL_CONDITIONER ############
SignalConditioner.implementation=Signal_Conditioner

DataTypeAdapter.implementation=Pass_Through
InputFilter.implementation=Pass_Through
Resampler.implementation=Pass_Through


;######### CHANNELS CONFIG ################
Channels_2S.count=1
Channels.in_acquisition=1
Channel.signal=2S


;######### ACQUISITION CONFIG #############
Acquisition_2S.implementation=GPS_L2_M_PCPS_Acquisition
Acquisition_2S.item_type=gr_complex
Acquisition_2S.pfa=0.001
Acquisition_2S.doppler_max=8000
Acquisition_2S.doppler_step=100
Acquisition_2S.coherent_integration_time_ms=10
Acquisition_2S.max_dwells=2
Acquisition_2S.dump=false


;######### TRACKING CONFIG ################
Tracking_2S.implementation=GPS_L2_M_DLL_PLL_Tracking
Tracking_2S.item_type=gr_complex
Tracking_2S.pll_bw_hz=15.0
Tracking_2S.dll_bw_hz=1.0
Tracking_2S.early_late_space_chips=0.4
Tracking_2S.pll_filter_order=3
Tracking_2S.dll_filter_order=2
Tracking_2S.cn0_min=25
Tracking_2S.carrier_lock_th=0.85
Tracking_2S.dump=false


;######### TELEMETRY DECODER ##############
TelemetryDecoder_2S.implementation=GPS_L2C_Telemetry_Decoder


;######### OBSERVABLES #####################
Observables.implementation=Hybrid_Observables


;######### PVT #############################
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.nmea_dump_filename=./gnss_sdr_pvt.nmea
PVT.flag_nmea_tty_port=false
PVT.dump=false


;######### MONITOR #########################
Monitor.enable_monitor=false
Monitor.enable_protobuf=false